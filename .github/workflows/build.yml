name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    # branches:
    #   - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Build the app on macOS for three targets: arm64, x86_64 and universal.
  # push/PR -> compile check + app zip artifact (for manual testing)
  # tag v*  -> ad-hoc signed Release build -> DMG -> artifact for the release job
  build:
    name: Build (macOS, ${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      # 三个架构互相独立，一个挂了不影响另外两个的产出
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            archs: arm64
          - arch: x86_64
            archs: x86_64
          # - arch: universal
          #   archs: "arm64 x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FinderSync 扩展沙盒进程需要 Team 签名才有 App Group 容器的写权限：
      # ad-hoc 签名时扩展能读组容器但写入 EPERM（POSIX Code=1），「访达右键打开终端」
      # 等依赖扩展→主app IPC 的功能会静默失败。CI 从 secrets 导入 Apple Development
      # 证书签名；未配置证书时回退 ad-hoc（fork PR 拿不到 secrets，仅编译检查用）。
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::warning::未配置 BUILD_CERTIFICATE_BASE64，回退 ad-hoc 签名（FinderSync 扩展将无 App Group 写权限）"
            echo "CS_IDENTITY=-" >> "$GITHUB_ENV"
            echo "CS_TEAM=" >> "$GITHUB_ENV"
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KC_PATH="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC_PATH"
          # 校验私钥真的进来了:p12 只导出证书没带私钥时(常见坑)这里为 0,
          # 否则后续 set-key-partition-list 只报隐晦的 SecItemCopyMatching
          COUNT="$(security find-identity -v -p codesigning "$KC_PATH" | awk '/valid identities found/ {print $1}')"
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::keychain 里没有可签名的身份——导出的 p12 大概率没带私钥。请在钥匙串访问「我的证书」里展开证书条目确认有「专用密钥」,连私钥一起导出 .p12 后更新 secret;若私钥不可导出(Xcode 生成于其它机器),在 Xcode → Accounts → Manage Certificates 新建证书后重新导出"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC_PATH"
          security list-keychain -d user -s "$KC_PATH" login.keychain
          echo "CS_IDENTITY=Apple Development" >> "$GITHUB_ENV"
          # Team ID 不入库：在仓库 Settings → Secrets and variables → Actions → Variables
          # 里加一个 APPLE_TEAM_ID（值是你的 10 位 Apple Developer Team ID）。
          if [ -z "${{ vars.APPLE_TEAM_ID }}" ]; then
            echo "::error::已导入签名证书但缺少 APPLE_TEAM_ID 仓库变量——请在 Variables 里补上 Team ID，否则签名无效、扩展拿不到 App Group 写权限"
            exit 1
          fi
          echo "CS_TEAM=${{ vars.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      # 应用内更新检测拿 CFBundleShortVersionString 与 GitHub tag 比大小，
      # 必须让构建产物的版本号跟 tag 对齐：tag 构建注入 vX.Y.Z 去掉 v，
      # 非 tag 构建注入 0.0.0-dev（低于任何正式版本，不会误判成最新）。
      - name: Resolve marketing version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            MV="${GITHUB_REF_NAME#v}"
          else
            MV="0.0.0-dev"
          fi
          echo "MV=$MV" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MV"

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project Zeroflow.xcodeproj \
            -scheme Zeroflow \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$CS_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$CS_TEAM" \
            MARKETING_VERSION="$MV" \
            ARCHS="${{ matrix.archs }}" ONLY_ACTIVE_ARCH=NO \
            build

      # The product path is not always deterministic (may land in
      # ArchiveIntermediates), so locate it and export APP_PATH.
      - name: Locate app bundle
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Zeroflow.app"
          if [ ! -d "$APP" ]; then
            APP="$(find build/Build -type d -name 'Zeroflow.app' -path '*Release*' | head -n 1)"
          fi
          if [ ! -d "$APP" ]; then
            echo "::error::Zeroflow.app not found under build/Build"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # 交叉编译最容易静默出错的地方：在 arm64 runner 上编 x86_64 时，
      # 只要 ARCHS 没覆盖到，就可能悄悄产出 universal（甚至本机架构）的二进制，
      # 包名对、内容不对。逐个 Mach-O 核对架构集合。
      - name: Verify binary architecture
        run: |
          set -euo pipefail
          EXPECTED="${{ matrix.archs }}"
          normalize() { echo "$1" | tr ' ' '\n' | grep -v '^$' | sort | tr '\n' ' ' | sed 's/ *$//'; }
          EXPECTED_N="$(normalize "$EXPECTED")"

          check() {
            bin="$1"
            if [ ! -f "$bin" ]; then
              echo "::error::缺少可执行文件: $bin"
              exit 1
            fi
            actual="$(lipo -archs "$bin")"
            echo "$bin: $actual"
            if [ "$(normalize "$actual")" != "$EXPECTED_N" ]; then
              echo "::error::$bin 架构不符：期望 '$EXPECTED_N'，实际 '$actual'"
              exit 1
            fi
          }

          check "$APP_PATH/Contents/MacOS/Zeroflow"
          shopt -s nullglob
          for appex in "$APP_PATH"/Contents/PlugIns/*.appex; do
            check "$appex/Contents/MacOS/$(basename "$appex" .appex)"
          done

      - name: Verify code signature
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv "$APP_PATH/Contents/PlugIns/FinderSyncExtension.appex"
          # 发 Release 的包必须带 Team 签名，否则扩展沙盒无 App Group 写权限
          if [ -n "${CS_TEAM:-}" ]; then
            codesign -dv "$APP_PATH/Contents/PlugIns/FinderSyncExtension.appex" 2>&1 \
              | grep -q "TeamIdentifier=$CS_TEAM" \
              || { echo "::error::appex 未按 Team 签名，沙盒下 App Group 写入会被拒（打开终端功能会失效）"; exit 1; }
          fi

      - name: Package app zip
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ditto -c -k --keepParent --sequesterRsrc "$APP_PATH" "Zeroflow-macos-${{ matrix.arch }}.zip"

      - name: Upload app artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: Zeroflow-macos-${{ matrix.arch }}
          path: Zeroflow-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install create-dmg
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: brew install create-dmg

      - name: Create DMG
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="staging"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/Zeroflow.app"
          create-dmg \
            --volname "Zeroflow $VERSION (${{ matrix.arch }})" \
            --background dmg_bg.png \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Zeroflow.app" 160 146 \
            --app-drop-link 500 146 \
            --hide-extension "Zeroflow.app" \
            "Zeroflow-$VERSION-${{ matrix.arch }}.dmg" \
            "$STAGING"

      - name: Upload DMG artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v5
        with:
          name: Zeroflow-dmg-${{ matrix.arch }}
          path: Zeroflow-*.dmg
          if-no-files-found: error
          retention-days: 7

  # Create GitHub Release when a version tag is pushed
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zeroflow ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            1. Pick the package for your Mac, double-click the DMG, then drag Zeroflow into the Applications folder.
               - **Apple Silicon (M1/M2/M3/M4)** → `Zeroflow-*-arm64.dmg`
               - **Intel Mac** → `Zeroflow-*-x86_64.dmg`
               - **Not sure** → `Zeroflow-*-universal.dmg` (works on both, larger download)
            2. The app is not signed or notarized by an Apple Developer.
               If you see a warning such as `App is damaged and can't be opened` or `Apple cannot verify the developer` when launching it for the first time, use either of the following methods:
              - Go to **System Settings → Privacy & Security** and click **Open Anyway**.
              - Or run the following command in Terminal, then try opening the app again:
                `xattr -cr /Applications/Zeroflow.app`
          files: |
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
