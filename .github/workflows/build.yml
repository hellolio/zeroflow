name: Release

# CI 不编译。各架构的 Zeroflow.app 由本地构建好提交到 dist/ 下，
# 这里只等 tag：把 dist/<arch>/Zeroflow.app 打包成 DMG，挂到对应的 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  package:
    name: Package DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      # 两个架构互相独立，一个挂了不影响另一个的产出
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="dist/${{ matrix.arch }}/Zeroflow.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP 不存在——发版前先把 ${{ matrix.arch }} 架构的构建产物提交到 dist/ 下"
            exit 1
          fi
          echo "打包 $APP"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          ditto "dist/${{ matrix.arch }}/Zeroflow.app" "$STAGING/Zeroflow.app"
          create-dmg \
            --volname "Zeroflow $VERSION (${{ matrix.arch }})" \
            --background dmg_bg.png \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Zeroflow.app" 160 146 \
            --app-drop-link 500 146 \
            --hide-extension "Zeroflow.app" \
            "Zeroflow-$VERSION-${{ matrix.arch }}.dmg" \
            "$STAGING"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: Zeroflow-dmg-${{ matrix.arch }}
          path: Zeroflow-*.dmg
          if-no-files-found: error
          retention-days: 7

  # Create GitHub Release when a version tag is pushed
  release:
    name: Create Release
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zeroflow ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            1. Pick the package for your Mac, double-click the DMG, then drag Zeroflow into the Applications folder.
               - **Apple Silicon (M1/M2/M3/M4)** → `Zeroflow-*-arm64.dmg`
               - **Intel Mac** → `Zeroflow-*-x86_64.dmg`
            2. The app is not signed or notarized by an Apple Developer.
               If you see a warning such as `App is damaged and can't be opened` or `Apple cannot verify the developer` when launching it for the first time, use either of the following methods:
              - Go to **System Settings → Privacy & Security** and click **Open Anyway**.
              - Or run the following command in Terminal, then try opening the app again:
                `xattr -cr /Applications/Zeroflow.app`
          files: |
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
